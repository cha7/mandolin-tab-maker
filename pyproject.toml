[project]
name = "mandolin-tab-maker"
version = "0.0.1"
description = "Phase 0: extract a song's melody from a recording and arrange it as a mandolin tab"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6,<2.9",
    "torchaudio>=2.6,<2.9",
    "demucs==4.0.1",
    "torchcrepe>=0.0.23",
    "beat-this",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "music21>=9.1",
    "mir_eval>=0.7",
    "yt-dlp>=2025.1.1",
    "imageio-ffmpeg>=0.5",
    "pyyaml>=6",
]

[project.scripts]
mtab = "mtab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
beat-this = { git = "https://github.com/CPJKU/beat_this" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtab"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
